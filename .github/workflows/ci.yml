name: CI

on:
  push:
    branches:
      - master
      - dev
      - boilerplate
      - idiomatic
      - rc1
      - rc2
      - rc3
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  cell:
    name: CI (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-clang
            os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - id: linux-gcc
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - id: macos-clang
            os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          - id: macos-gcc
            os: macos-latest
            c_compiler: gcc
            cpp_compiler: g++
          - id: windows-cl
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - id: windows-mingw
            os: windows-latest
            c_compiler: mingw
            cpp_compiler: g++
    uses: ./.github/workflows/ci-cell.yml
    with:
      cell-id: ${{ matrix.id }}
      os: ${{ matrix.os }}
      c-compiler: ${{ matrix.c_compiler }}
      cpp-compiler: ${{ matrix.cpp_compiler }}
      build-type: Release
    secrets: inherit

  documentation:
    name: Build API documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Build API documentation
        shell: bash
        run: |
          set -euo pipefail
          ./generate_doxygen.sh
          test -f _build/doxygen/html/index.html

  install-smoke:
    name: Install smoke (${{ matrix.os }}, ${{ matrix.c_compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: windows-latest
            c_compiler: mingw
            cpp_compiler: g++

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux' && matrix.c_compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Setup MSYS2 MinGW
        if: runner.os == 'Windows' && matrix.c_compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Install SIS dependencies
        uses: ./.github/actions/install-sis-deps
        with:
          build-type: ${{ env.BUILD_TYPE }}
          c-compiler: ${{ matrix.c_compiler == 'mingw' && 'gcc' || matrix.c_compiler }}
          cpp-compiler: ${{ matrix.c_compiler == 'mingw' && 'g++' || matrix.cpp_compiler }}
          dependencies: STLSoft
          toolchain: ${{ matrix.c_compiler == 'mingw' && 'mingw' || '' }}

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.c_compiler }}" = "cl" ]; then
            cmake -B build -S . \
              -DCMAKE_DISABLE_FIND_PACKAGE_MFC=TRUE \
              -DCMAKE_PREFIX_PATH="${{ env.SIS_DEPS }}" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=OFF
          elif [ "${{ matrix.c_compiler }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
            cmake -B build -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
              -DCMAKE_C_COMPILER=gcc \
              -DCMAKE_CXX_COMPILER=g++ \
              -DCMAKE_PREFIX_PATH="${{ env.SIS_DEPS }}" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=OFF
          else
            cmake -B build -S . \
              -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
              -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}" \
              -DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}" \
              -DCMAKE_PREFIX_PATH="${{ env.SIS_DEPS }}" \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_TESTING=OFF
          fi

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.c_compiler }}" = "cl" ]; then
            cmake --build build --config "${{ env.BUILD_TYPE }}" --parallel
          elif [ "${{ matrix.c_compiler }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
            cmake --build build --parallel 2
          else
            cmake --build build --parallel
          fi

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${RUNNER_TEMP}/install-prefix"
          echo "INSTALL_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          if [ "${{ matrix.c_compiler }}" = "cl" ]; then
            cmake --install build --config "${{ env.BUILD_TYPE }}" --prefix "$PREFIX"
          else
            cmake --install build --prefix "$PREFIX"
          fi

      - name: Verify install tree
        shell: bash
        run: |
          set -euo pipefail
          test -f "${INSTALL_PREFIX}/include/b64/b64.h"
          test -f "${INSTALL_PREFIX}/lib/cmake/b64/b64-config.cmake"

      - name: Configure and run install smoke consumer
        shell: bash
        run: |
          set -euo pipefail
          CONSUMER="${RUNNER_TEMP}/consumer"
          mkdir -p "$CONSUMER"
          cat > "$CONSUMER/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.13)
          project(b64_install_smoke CXX)
          # STLSoft must come from b64-config.cmake's find_dependency().
          find_package(b64 REQUIRED)
          add_executable(consumer consumer.cpp)
          target_link_libraries(consumer PRIVATE b64::core)
          EOF
          cat > "$CONSUMER/consumer.cpp" <<'EOF'
          #include <b64/b64.hpp>
          int main() { return 0; }
          EOF
          if [ "${{ matrix.c_compiler }}" = "cl" ]; then
            cmake -S "$CONSUMER" -B consumer-build \
              -DCMAKE_PREFIX_PATH="${INSTALL_PREFIX};${{ env.SIS_DEPS }}"
            cmake --build consumer-build --config "${{ env.BUILD_TYPE }}" --parallel
            consumer-build/${{ env.BUILD_TYPE }}/consumer.exe
          elif [ "${{ matrix.c_compiler }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
            cmake -S "$CONSUMER" -B consumer-build -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
              -DCMAKE_PREFIX_PATH="${INSTALL_PREFIX};${{ env.SIS_DEPS }}"
            cmake --build consumer-build --parallel 2
            consumer-build/consumer.exe
          else
            cmake -S "$CONSUMER" -B consumer-build \
              -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
              -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}" \
              -DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}" \
              -DCMAKE_PREFIX_PATH="${INSTALL_PREFIX};${{ env.SIS_DEPS }}"
            cmake --build consumer-build --parallel
            consumer-build/consumer
          fi
